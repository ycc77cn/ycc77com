<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://pic1.imgdb.cn/item/68f1b8ccc5157e1a887a8c09.png">
    <title>YCC技术录 - 重要迁移公告</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ycc: {
                            primary: '#7B61FF',
                            secondary: '#4A80FF',
                            dark: '#0F172A',
                            light: '#F8FAFC',
                            muted: '#94A3B8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'SF Pro Display', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'bg-flow': 'bgFlow 20s ease infinite',
                        'card-fade': 'cardFade 0.9s cubic-bezier(0.16, 1, 0.3, 1)',
                        'text-glow': 'textGlow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        bgFlow: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        },
                        cardFade: {
                            '0%': { opacity: 0, transform: 'translateY(20px) scale(0.98)' },
                            '100%': { opacity: 1, transform: 'translateY(0) scale(1)' },
                        },
                        textGlow: {
                            '0%': { textShadow: '0 0 8px rgba(123, 97, 255, 0.4)' },
                            '100%': { textShadow: '0 0 16px rgba(123, 97, 255, 0.8)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
            }
            .btn-lift {
                transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            }
            .btn-lift:hover {
                transform: translateY(-3px) scale(1.01);
                box-shadow: 0 10px 20px -8px rgba(74, 128, 255, 0.3);
            }
            .bg-noise {
                background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5 5zM32 63c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5 5zm57-13c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            }
        }
    </style>
    <!-- 字体预加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-ycc-dark min-h-screen flex items-center justify-center px-6 py-12 overflow-x-hidden bg-noise">
    <!-- 动态渐变背景 -->
    <div class="absolute inset-0 bg-gradient-to-br from-ycc-dark via-[#1E293B] to-[#0A101F] bg-[length:200%_200%] animate-bg-flow z-0"></div>
    
    <!-- 装饰性模糊元素（响应式调整） -->
    <div class="absolute top-1/5 left-1/6 w-[clamp(200px,50vw,400px)] h-[clamp(200px,50vw,400px)] bg-ycc-primary/12 rounded-full blur-3xl z-0"></div>
    <div class="absolute bottom-1/4 right-1/5 w-[clamp(150px,40vw,350px)] h-[clamp(150px,40vw,350px)] bg-ycc-secondary/12 rounded-full blur-3xl z-0"></div>

    <!-- 核心公告卡片（优化布局和间距） -->
    <div class="relative z-10 max-w-lg w-full glass-card bg-ycc-dark/80 rounded-2xl shadow-[0_0_40px_rgba(74,128,255,0.15)] border border-ycc-light/10 p-6 md:p-8 animate-card-fade">
        <!-- 关闭按钮（优化位置和点击区域） -->
        <button id="closeBtn" class="absolute top-5 right-5 w-9 h-9 flex items-center justify-center text-ycc-muted hover:text-ycc-light transition-colors duration-300 hover:scale-110 rounded-full hover:bg-ycc-light/5">
            <i class="fa fa-times text-lg"></i>
        </button>

        <!-- 公告头部（优化间距） -->
        <div class="text-center mb-7">
            <div class="inline-block mb-4 p-4 rounded-full bg-gradient-to-r from-ycc-primary to-ycc-secondary shadow-lg">
                <i class="fa fa-bullhorn text-3xl text-white animate-text-glow"></i>
            </div>
            <h1 class="text-[clamp(1.4rem,3vw,2rem)] font-bold text-white mb-2">YCC技术录 · 迁移公告</h1>
            <div class="w-20 h-1.5 bg-gradient-to-r from-ycc-primary to-ycc-secondary mx-auto rounded-full"></div>
        </div>

        <!-- 美化后的公告内容（优化行高和间距） -->
        <div class="text-ycc-light/95 space-y-4 mb-8 text-base leading-relaxed [line-height:1.6]">
            <p class="flex items-start gap-3">
                <i class="fa fa-info-circle text-ycc-primary mt-1 w-5 text-center"></i>
                <span>杨CC技术录全站数据意外丢失，现已完成核心内容迁移至 <span class="font-semibold text-gradient bg-gradient-to-r from-ycc-primary to-ycc-secondary animate-text-glow"><a href="https://ycc77.cn">「杨CC资源站」</a></span>。</span>
            </p>
            <p class="flex items-start gap-3">
                <i class="fa fa-arrow-right text-ycc-primary mt-1 w-5 text-center"></i>
                <span>后续所有技术文章将统一更新至：<span class="font-semibold text-gradient bg-gradient-to-r from-ycc-primary to-ycc-secondary animate-text-glow"><a href="https://ycc77.cn">「杨CC资源站」</a></span>。</span>
            </p>
            <p class="flex items-start gap-3 text-ycc-muted/90">
                <i class="fa fa-exclamation-triangle text-ycc-primary mt-1 w-5 text-center"></i>
                <span>原域名 <span class="font-medium text-ycc-light">ycc77.com</span> 即将停止服务，随时可能关闭。</span>
            </p>
            <p class="flex items-start gap-3 text-ycc-muted/90">
                <i class="fa fa-hand-point-right text-ycc-primary mt-1 w-5 text-center"></i>
                <span>如需查阅文章，请前往<span class="font-semibold text-gradient bg-gradient-to-r from-ycc-primary to-ycc-secondary animate-text-glow"><a href="https://ycc77.cn">「杨CC资源站」</a></span>→「杨CC技术录」板块。</span>
            </p>
            <p class="text-xs text-ycc-muted/70 italic mt-3 pl-8">※ 关闭本公告弹窗将自动跳转至原始数据页面</p>
        </div>

        <!-- 功能按钮组（优化尺寸和间距） -->
        <div class="flex gap-4 flex-col sm:flex-row">
            <a href="https://ycc77.cn" target="_blank" class="btn-lift flex-1 py-3.5 px-6 rounded-xl bg-gradient-to-r from-ycc-primary to-ycc-secondary text-white font-medium text-center shadow-lg min-h-[50px] flex items-center justify-center">
                <i class="fa fa-external-link mr-2"></i>访问YCC资源站
            </a>
            <a href="indexx.html" class="btn-lift flex-1 py-3.5 px-6 rounded-xl bg-ycc-light/10 text-ycc-light font-medium text-center border border-ycc-light/20 hover:bg-ycc-light/15 min-h-[50px] flex items-center justify-center">
                <i class="fa fa-database mr-2"></i>打开原网站
            </a>
        </div>
    </div>

    <script>
        // 关闭按钮跳转逻辑
        document.getElementById('closeBtn').addEventListener('click', () => {
            window.location.href = 'indexx.html';
        });

        // 页面加载优化
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('opacity-100');
            document.body.classList.remove('opacity-0');
        });

        // 按钮点击反馈
        const buttons = document.querySelectorAll('.btn-lift');
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-98');
                setTimeout(() => this.classList.remove('scale-98'), 200);
            });
        });
    </script>
</body>
</html>
